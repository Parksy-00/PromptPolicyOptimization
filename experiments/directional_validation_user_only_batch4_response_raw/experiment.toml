# One proposal/refinement per question; admit only after full validation, with ties allowed.
[edit_refinement]
mode = "validation_gated_per_example"
likelihood_scope = "response"
drift_correction = "none"
score_unit = "mean"

[objective]
mode = "directional_likelihood"

# Transport settings; same frozen server performs generation and fixed-ID scoring.
