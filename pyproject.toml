[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "prompt-policy-optimization"
version = "0.1.0"
description = "GEPA prompt search with verified fixed-trajectory likelihood improvements"
requires-python = ">=3.11"
dependencies = ["gepa==0.1.4"]

[project.optional-dependencies]
local = ["torch>=2.6,<3", "transformers>=4.51,<6", "huggingface-hub>=0.30"]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
prompt-policy = "prompt_policy.cli:main"

[tool.uv.sources]
gepa = { path = "vendor/gepa", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local: requires torch and transformers; uses tiny random models, no downloads"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

